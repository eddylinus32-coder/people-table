<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People Table</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Login screen (Image A) -->
  <main id="login" class="login">
    <section class="card">
      <h1>Welcome Back</h1>
      <p>Sign in with your Google account to view the people table.</p>
      <button id="signin" class="google-btn" type="button" disabled>
        <span class="g-badge" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="20" height="20">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/>
            <path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
        </span>
        <span>Sign in with Google</span>
      </button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </section>
  </main>

  <!-- 3D view -->
  <div id="app" hidden>
    <div id="container"></div>
    <div id="userbar">
      <span id="username"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div id="menu">
      <button id="table" type="button">TABLE</button>
      <button id="sphere" type="button">SPHERE</button>
      <button id="helix" type="button">HELIX</button>
      <button id="grid" type="button">GRID</button>
    </div>
    <div id="legend" aria-label="Net worth colour legend">
      <span class="lg"><i class="sw red"></i>&lt; $100K</span>
      <span class="lg"><i class="sw orange"></i>$100K &ndash; $200K</span>
      <span class="lg"><i class="sw green"></i>&gt; $200K</span>
    </div>
    <div id="status" hidden></div>
  </div>

  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="main.js"></script>
</body>
</html>
